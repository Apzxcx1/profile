<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mingai — 铭奈</title>

    <meta
        name="description"
        content="Mingai（铭奈）的个人主页"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text: #fff;
            --subtext: rgba(255,255,255,.68);
            --glass: rgba(255,255,255,.12);
            --border: rgba(255,255,255,.20);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            color: var(--text);

            background:
                linear-gradient(
                    rgba(20, 18, 24, .45),
                    rgba(20, 18, 24, .62)
                ),
                url("bg.png")
                center / cover fixed no-repeat;

            overflow-x: hidden;
        }

        /* 背景模糊 */
        body::before {
            content: "";

            position: fixed;
            inset: -30px;

            background:
                url("bg.png")
                center / cover no-repeat;

            filter: blur(18px);

            transform: scale(1.05);

            opacity: .45;

            z-index: -2;
        }

        /* 暗色渐变 */
        body::after {
            content: "";

            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(255,190,215,.20),
                    transparent 40%
                ),
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,.05),
                    rgba(0,0,0,.35)
                );

            z-index: -1;
        }

        /* 主容器 */
        .page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .container {
            width: min(480px, 100%);

            text-align: center;

            animation: appear .8s ease both;
        }

        /* 头像 */
        .avatar {
            width: 88px;
            height: 88px;

            margin: 0 auto 22px;

            border-radius: 50%;

            background:
                url("bg.png")
                center 20% / cover;

            border: 2px solid rgba(255,255,255,.75);

            box-shadow:
                0 12px 40px rgba(0,0,0,.28),
                0 0 0 6px rgba(255,255,255,.07);

            transition: .35s ease;
        }

        .avatar:hover {
            transform: scale(1.06) rotate(3deg);
        }

        /* 名字 */
        h1 {
            font-size: 48px;

            line-height: 1;

            font-weight: 750;

            letter-spacing: -2px;

            text-shadow:
                0 5px 30px rgba(0,0,0,.28);
        }

        .chinese-name {
            margin-top: 9px;

            font-size: 14px;

            letter-spacing: 7px;

            color: var(--subtext);
        }

        .description {
            margin-top: 16px;

            font-size: 13px;

            color: var(--subtext);

            letter-spacing: .5px;
        }

        /* 分割线 */
        .line {
            width: 35px;
            height: 1px;

            margin: 28px auto;

            background: rgba(255,255,255,.45);
        }

        /* 链接 */
        .links {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .link {
            position: relative;

            display: flex;
            align-items: center;

            min-height: 58px;

            padding: 0 20px;

            color: white;

            text-decoration: none;

            background: rgba(255,255,255,.10);

            border:
                1px solid rgba(255,255,255,.17);

            border-radius: 17px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.10);

            transition:
                transform .25s ease,
                background .25s ease,
                border-color .25s ease;
        }

        .link:hover {
            transform: translateY(-2px);

            background: rgba(255,255,255,.17);

            border-color:
                rgba(255,255,255,.32);
        }

        /* 图标 */
        .icon {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 13px;

            border-radius: 9px;

            background:
                rgba(255,255,255,.12);

            font-size: 15px;

            flex-shrink: 0;
        }

        /* 文字 */
        .link-content {
            text-align: left;

            flex: 1;

            min-width: 0;
        }

        .link-title {
            font-size: 14px;

            font-weight: 600;

            line-height: 1.3;
        }

        .link-subtitle {
            margin-top: 2px;

            font-size: 11px;

            color: rgba(255,255,255,.48);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 箭头 */
        .arrow {
            font-size: 16px;

            color:
                rgba(255,255,255,.42);

            transition: .25s ease;
        }

        .link:hover .arrow {
            color: white;

            transform:
                translate(2px,-2px);
        }

        /* Footer */
        footer {
            margin-top: 25px;

            font-size: 11px;

            color:
                rgba(255,255,255,.38);
        }

        /* Toast */
        .toast {
            position: fixed;

            left: 50%;
            bottom: 28px;

            transform:
                translate(-50%, 15px);

            padding: 10px 17px;

            border-radius: 999px;

            background:
                rgba(25,25,30,.72);

            border:
                1px solid rgba(255,255,255,.15);

            backdrop-filter: blur(15px);

            font-size: 12px;

            opacity: 0;

            pointer-events: none;

            transition: .3s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* 动画 */
        @keyframes appear {
            from {
                opacity: 0;
                transform:
                    translateY(20px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        /* 手机 */
        @media (max-width: 600px) {

            .page {
                padding:
                    35px 17px;
            }

            h1 {
                font-size: 42px;
            }

            .avatar {
                width: 78px;
                height: 78px;
            }

            .link {
                min-height: 56px;
            }
        }

    </style>
</head>

>

<script>

    function copyText(text, message) {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            navigator.clipboard
                .writeText(text)
                .then(() => {
                    showToast(message);
                });

        } else {

            const input =
                document.createElement("input");

            input.value = text;

            document.body.appendChild(input);

            input.select();

            document.execCommand("copy");

            input.remove();

            showToast(message);
        }
    }


    function showToast(message) {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.classList.add("show");

        setTimeout(() => {

            toast.classList.remove("show");

        }, 1600);
    }

</script>
