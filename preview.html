<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mingai · 铭奈</title>

    <meta name="description" content="Mingai（铭奈）的个人主页｜音乐创作者 / Creator">
    <meta name="theme-color" content="#d98da7">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #e58da8;
            --pink-light: #ffdce7;
            --white: rgba(255,255,255,.88);
            --glass: rgba(255,255,255,.18);
            --border: rgba(255,255,255,.35);
            --shadow: rgba(105,45,70,.25);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            color: white;
            overflow-x: hidden;

            background:
                linear-gradient(
                    135deg,
                    rgba(120,50,80,.35),
                    rgba(255,160,190,.18)
                ),
                url("bg.png") center center / cover fixed no-repeat;

            position: relative;
        }

        /* 背景遮罩 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    rgba(30,20,30,.45),
                    rgba(255,130,170,.12),
                    rgba(20,20,30,.38)
                );

            z-index: -3;
        }

        /* 模糊背景 */
        body::after {
            content: "";
            position: fixed;
            inset: -30px;

            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);

            z-index: -2;
        }

        /* 浮动光晕 */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
            opacity: .45;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb.one {
            width: 280px;
            height: 280px;
            background: #ffb8cf;
            top: 5%;
            left: -100px;
        }

        .orb.two {
            width: 350px;
            height: 350px;
            background: #a8dce7;
            right: -120px;
            bottom: 5%;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translateY(-20px) translateX(0);
            }
            to {
                transform: translateY(30px) translateX(30px);
            }
        }

        /* 页面 */
        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 70px 20px;
        }

        .container {
            width: min(880px, 100%);
        }

        /* 顶部 */
        .hero {
            text-align: center;
            margin-bottom: 35px;

            animation: fadeUp .8s ease both;
        }

        .avatar {
            width: 108px;
            height: 108px;
            margin: 0 auto 20px;

            border-radius: 50%;

            background:
                url("bg.png")
                center 25% / cover;

            border: 4px solid rgba(255,255,255,.7);

            box-shadow:
                0 15px 50px rgba(80,30,50,.35),
                0 0 0 8px rgba(255,255,255,.08);

            transition: .4s ease;
        }

        .avatar:hover {
            transform: rotate(5deg) scale(1.06);
        }

        .hero h1 {
            font-size: clamp(42px, 8vw, 76px);
            font-weight: 800;
            letter-spacing: -3px;

            text-shadow:
                0 5px 25px rgba(70,30,50,.35);
        }

        .hero .name {
            font-size: 16px;
            letter-spacing: 6px;
            margin-top: 5px;
            opacity: .8;
        }

        .hero .bio {
            margin-top: 18px;
            font-size: 15px;
            opacity: .8;
            letter-spacing: 1px;
        }

        /* 主卡片 */
        .glass {
            background: var(--glass);

            border: 1px solid var(--border);

            border-radius: 28px;

            box-shadow:
                0 25px 70px var(--shadow),
                inset 0 1px 0 rgba(255,255,255,.25);

            backdrop-filter: blur(22px) saturate(130%);
            -webkit-backdrop-filter: blur(22px) saturate(130%);
        }

        .profile {
            padding: 30px;

            animation:
                fadeUp .8s .15s ease both;
        }

        /* 信息 */
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 13px;
            letter-spacing: 2px;
            opacity: .65;

            margin-bottom: 15px;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 16px;
            border-radius: 20px;
            background: white;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .info {
            padding: 18px;

            border-radius: 18px;

            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.18);

            transition: .3s ease;
        }

        .info:hover {
            background: rgba(255,255,255,.2);
            transform: translateY(-3px);
        }

        .info-label {
            font-size: 12px;
            opacity: .6;
            margin-bottom: 7px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            word-break: break-all;
        }

        .copy {
            cursor: pointer;
        }

        .copy::after {
            content: " 点击复制";
            font-size: 11px;
            opacity: .45;
            font-weight: normal;
        }

        /* 音乐 */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .music-card {
            position: relative;

            padding: 22px;

            border-radius: 22px;

            text-decoration: none;
            color: white;

            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.2);

            overflow: hidden;

            transition:
                transform .35s ease,
                background .35s ease,
                box-shadow .35s ease;
        }

        .music-card::before {
            content: "";
            position: absolute;

            width: 160px;
            height: 160px;

            border-radius: 50%;

            background: rgba(255,255,255,.12);

            right: -70px;
            bottom: -80px;

            transition: .4s ease;
        }

        .music-card:hover {
            transform: translateY(-7px);
            background: rgba(255,255,255,.22);

            box-shadow:
                0 15px 40px rgba(50,20,35,.22);
        }

        .music-card:hover::before {
            transform: scale(1.5);
        }

        .music-icon {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: rgba(255,255,255,.2);

            font-size: 21px;

            margin-bottom: 15px;
        }

        .music-name {
            font-size: 18px;
            font-weight: 700;
        }

        .music-desc {
            font-size: 12px;
            opacity: .6;
            margin-top: 5px;
        }

        .arrow {
            position: absolute;
            right: 20px;
            top: 20px;

            font-size: 18px;
            opacity: .5;

            transition: .3s ease;
        }

        .music-card:hover .arrow {
            opacity: 1;
            transform: translate(3px,-3px);
        }

        /* 底部 */
        footer {
            text-align: center;
            margin-top: 25px;

            font-size: 12px;
            opacity: .55;

            animation: fadeUp .8s .35s ease both;
        }

        footer span {
            margin: 0 6px;
        }

        /* Toast */
        .toast {
            position: fixed;

            left: 50%;
            bottom: 35px;

            transform: translate(-50%, 20px);

            padding: 12px 20px;

            border-radius: 999px;

            background: rgba(20,20,25,.7);
            border: 1px solid rgba(255,255,255,.2);

            backdrop-filter: blur(15px);

            font-size: 13px;

            opacity: 0;
            pointer-events: none;

            transition: .3s ease;

            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 手机 */
        @media (max-width: 650px) {

            .page {
                padding: 45px 15px;
            }

            .profile {
                padding: 20px;
                border-radius: 24px;
            }

            .info-grid,
            .music-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

            .avatar {
                width: 90px;
                height: 90px;
            }

            body {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <main class="page">

        <div class="container">

            <!-- 个人信息 -->
            <section class="hero">

                <div class="avatar"></div>

                <h1>Mingai</h1>

                <div class="name">
                    铭奈
                </div>

                <div class="bio">
                    Music Producer · Creator
                </div>

            </section>


            <section class="glass profile">

                <!-- 联系方式 -->
                <div class="section-title">
                    CONTACT
                </div>

                <div class="info-grid">

                    <div
                        class="info copy"
                        onclick="copyText('3490963334', 'QQ 已复制')"
                    >
                        <div class="info-label">
                            QQ
                        </div>

                        <div class="info-value">
                            3490963334
                        </div>
                    </div>


                    <div
                        class="info copy"
                        onclick="copyText('19177629824', '微信 / 手机号已复制')"
                    >
                        <div class="info-label">
                            微信 / 手机号
                        </div>

                        <div class="info-value">
                            19177629824
                        </div>
                    </div>

                </div>


                <!-- 音乐 -->
                <div class="section-title">
                    MUSIC
                </div>

                <div class="music-grid">

                    <a
                        class="music-card"
                        href="https://music.163.com/#/artist?id=62267035"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="music-icon">
                            ♪
                        </div>

                        <div class="music-name">
                            网易云音乐
                        </div>

                        <div class="music-desc">
                            Mingai（铭奈） · 歌手
                        </div>

                        <div class="arrow">
                            ↗
                        </div>

                    </a>


                    <a
                        class="music-card"
                        href="https://open.spotify.com/artist/5Ypi1UP3PGxmNcGKswuhBm?si=vZik29rXQnmduMxE2ndSHg"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <div class="music-icon">
                            ♫
                        </div>

                        <div class="music-name">
                            Spotify
                        </div>

                        <div class="music-desc">
                            Mingai · Artist
                        </div>

                        <div class="arrow">
                            ↗
                        </div>

                    </a>

                </div>

            </section>


            <footer>
                © 2026 Mingai
                <span>·</span>
                铭奈
            </footer>

        </div>

    </main>


    <div class="toast" id="toast">
        已复制
    </div>


    <script>

        function copyText(text, message) {

            navigator.clipboard.writeText(text)
                .then(() => {

                    showToast(message);

                })
                .catch(() => {

                    const input = document.createElement("input");

                    input.value = text;

                    document.body.appendChild(input);

                    input.select();

                    document.execCommand("copy");

                    input.remove();

                    showToast(message);

                });

        }


        function showToast(message) {

            const toast =
                document.getElementById("toast");

            toast.textContent = message;

            toast.classList.add("show");

            setTimeout(() => {

                toast.classList.remove("show");

            }, 1800);

        }

    </script>

</body>
</html>
